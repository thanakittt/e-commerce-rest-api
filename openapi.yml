openapi: "3.0.3"
info:
  title: E-Commerce REST API
  version: "1.0"
servers:
  - url: http://localhost:3000/api

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:
    post:
      summary: Login a user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Invalid credentials
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users:
    get:
      summary: Get all users
      security:
        - bearerAuth: []
      tags:
        - Users
      responses:
        "200":
          description: Users fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/profile:
    get:
      summary: Get current user profile
      description: Get profile of the currently logged-in user
      security:
        - bearerAuth: []
      tags:
        - Users
      responses:
        "200":
          description: Profile fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Update current user profile
      description: Update profile of the currently logged-in user
      security:
        - bearerAuth: []
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidBody:
                  summary: Invalid body field
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: email
                        message: Invalid email address
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict - Duplicate email or phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emailConflict:
                  summary: Email conflict
                  value:
                    success: false
                    message: Email already exists
                phoneConflict:
                  summary: Phone conflict
                  value:
                    success: false
                    message: Phone already exists
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{id}:
    get:
      summary: Get a user by ID
      security:
        - bearerAuth: []
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: User fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/InvalidUserId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Update a user by ID
      security:
        - bearerAuth: []
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidUserId:
                  summary: Invalid user ID
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: params
                        field: id
                        message: Invalid user ID
                invalidBody:
                  summary: Invalid body field
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: email
                        message: Invalid email address
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict - Duplicate email or phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emailConflict:
                  summary: Email conflict
                  value:
                    success: false
                    message: Email already exists
                phoneConflict:
                  summary: Phone conflict
                  value:
                    success: false
                    message: Phone already exists
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userId}/role:
    patch:
      summary: Update user role (Admin)
      description: Change user role/permission. Accessible only by Admin.
      security:
        - bearerAuth: []
      tags:
        - Users
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRoleInput"
      responses:
        "200":
          description: User role updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateUserRoleResponse"
              example:
                success: true
                message: User role updated successfully
                data:
                  id: 1
                  role: admin
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidUserId:
                  summary: Invalid user ID
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: params
                        field: userId
                        message: User ID must be a positive integer
                invalidRole:
                  summary: Invalid role value
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: role
                        message: "Invalid role. Allowed values: user, admin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /categories:
    get:
      summary: Get all categories
      description: Retrieve a list of all categories. Public access.
      tags:
        - Categories
      responses:
        "200":
          description: Categories fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
              example:
                success: true
                message: Categories fetched successfully
                data:
                  - id: 1
                    name: Electronics
                  - id: 2
                    name: Clothing
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create a new category (Admin)
      description: Add a new category. Accessible only by Admin.
      security:
        - bearerAuth: []
      tags:
        - Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
              example:
                success: true
                message: Category created successfully
                data:
                  id: 1
                  name: Electronics
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                missingName:
                  summary: Missing name
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: name
                        message: Name is required
                emptyName:
                  summary: Empty name
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: name
                        message: Name cannot be empty
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Conflict - Category already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: Category already exists
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products:
    get:
      summary: Get all products
      tags:
        - Products
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Filter by category ID
          example: 1
      responses:
        "200":
          description: Products fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create a new product
      security:
        - bearerAuth: []
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                missingField:
                  summary: Missing required field
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: name
                        message: Name is required
                invalidCategory:
                  summary: Invalid category ID
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: categoryId
                        message: Category not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products/{id}:
    get:
      summary: Get a product by ID
      tags:
        - Products
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Product fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/InvalidProductId"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Update a product by ID
      security:
        - bearerAuth: []
      tags:
        - Products
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidProductId:
                  summary: Invalid product ID
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: params
                        field: id
                        message: Invalid product ID
                missingField:
                  summary: Missing required field
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: name
                        message: Name is required
                invalidCategory:
                  summary: Invalid category ID
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: categoryId
                        message: Category not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete a product by ID
      security:
        - bearerAuth: []
      tags:
        - Products
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Product deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: true
                message: Product deleted successfully
        "400":
          $ref: "#/components/responses/InvalidProductId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /carts:
    post:
      summary: Add product to cart
      security:
        - bearerAuth: []
      tags:
        - Carts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartInput"
      responses:
        "200":
          description: Product added to cart successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                missingField:
                  summary: Missing required field
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: productId
                        message: Product ID is required
                insufficientStock:
                  summary: Insufficient stock
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: quantity
                        message: Requested quantity exceeds available stock
                productNotFound:
                  summary: Product not found
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: productId
                        message: Product not found
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /carts/{id}:
    get:
      summary: Get cart by ID
      security:
        - bearerAuth: []
      tags:
        - Carts
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Cart fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
              example:
                success: true
                message: Cart fetched successfully
                data:
                  id: 1
                  userId: 1
                  items:
                    - productId: 1
                      name: Product 1
                      price: "100.00"
                      quantity: 2
                      subtotal: "200.00"
                  totalPrice: "200.00"
                  totalQuantity: 2
        "400":
          $ref: "#/components/responses/InvalidCartId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete cart by ID
      security:
        - bearerAuth: []
      tags:
        - Carts
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Cart deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: true
                message: Cart deleted successfully
        "400":
          $ref: "#/components/responses/InvalidCartId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /carts/{cartId}/items/{productId}:
    put:
      summary: Update item quantity in cart
      security:
        - bearerAuth: []
      tags:
        - Carts
      parameters:
        - name: cartId
          in: path
          required: true
          description: ID of the cart
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: productId
          in: path
          required: true
          description: ID of the product to update
          schema:
            type: integer
            minimum: 1
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemInput"
      responses:
        "200":
          description: Item quantity updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
              example:
                success: true
                message: Item quantity updated successfully
                data:
                  id: 1
                  userId: 1
                  items:
                    - productId: 1
                      name: Product 1
                      price: "100.00"
                      quantity: 3
                      subtotal: "300.00"
                  totalPrice: "300.00"
                  totalQuantity: 3
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidCartId:
                  summary: Invalid cart ID
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: params
                        field: cartId
                        message: Invalid cart ID
                invalidProductId:
                  summary: Invalid product ID
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: params
                        field: productId
                        message: Invalid product ID
                invalidQuantity:
                  summary: Invalid quantity
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: quantity
                        message: Quantity must be a positive integer
                insufficientStock:
                  summary: Insufficient stock
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: quantity
                        message: Requested quantity exceeds available stock
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Remove an item from cart
      security:
        - bearerAuth: []
      tags:
        - Carts
      parameters:
        - name: cartId
          in: path
          required: true
          description: ID of the cart
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: productId
          in: path
          required: true
          description: ID of the product to remove
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        "200":
          description: Item removed from cart successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                success: true
                message: Item removed from cart successfully
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidCartId:
                  summary: Invalid cart ID
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: params
                        field: cartId
                        message: Invalid cart ID
                invalidProductId:
                  summary: Invalid product ID
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: params
                        field: productId
                        message: Invalid product ID
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /carts/{id}/checkout:
    post:
      summary: Checkout active cart and create an order
      security:
        - bearerAuth: []
      tags:
        - Carts
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                success: true
                message: Order created successfully
                data:
                  id: 1
                  userId: 2
                  shippingAddress: "123 Sukhumvit Rd, Khlong Toei, Bangkok 10110"
                  paymentMethod: credit_card
                  status: pending
                  totalPrice: "289.49"
                  totalQuantity: 2
                  orderDate: "2026-09-19T00:00:00.000Z"
                  items:
                    - productId: 1
                      name: Wireless Noise-Cancelling Headphones
                      quantity: 1
                      unitPrice: "199.99"
                      subtotal: "199.99"
                    - productId: 2
                      name: Mechanical Gaming Keyboard
                      quantity: 1
                      unitPrice: "89.50"
                      subtotal: "89.50"
        "400":
          description: Validation failed or Cart is empty / Insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidCartId:
                  summary: Invalid cart ID
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: params
                        field: id
                        message: Invalid cart ID
                missingField:
                  summary: Missing required field
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: shippingAddress
                        message: Shipping address is required
                invalidPaymentMethod:
                  summary: Invalid payment method
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: paymentMethod
                        message: Invalid payment method
                emptyCart:
                  summary: Cart is empty
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: cart
                        message: Cart is empty
                insufficientStock:
                  summary: Insufficient stock
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: quantity
                        message: Requested quantity exceeds available stock
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /orders:
    get:
      summary: Get all orders for current user
      security:
        - bearerAuth: []
      tags:
        - Orders
      responses:
        "200":
          description: Orders fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersResponse"
              example:
                success: true
                message: Orders fetched successfully
                data:
                  - id: 1
                    userId: 2
                    shippingAddress: "123 Sukhumvit Rd, Khlong Toei, Bangkok 10110"
                    paymentMethod: credit_card
                    status: pending
                    cancellationReason: null
                    totalPrice: "289.49"
                    totalQuantity: 2
                    orderDate: "2026-09-19T00:00:00.000Z"
                    items:
                      - productId: 1
                        name: Wireless Noise-Cancelling Headphones
                        quantity: 1
                        unitPrice: "199.99"
                        subtotal: "199.99"
                      - productId: 2
                        name: Mechanical Gaming Keyboard
                        quantity: 1
                        unitPrice: "89.50"
                        subtotal: "89.50"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /orders/{id}:
    get:
      summary: Get order details by ID
      description: Retrieve order details by order ID. Accessible by the order owner (User) or Admin.
      security:
        - bearerAuth: []
      tags:
        - Orders
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Order fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
              example:
                success: true
                message: Order fetched successfully
                data:
                  id: 1
                  userId: 2
                  shippingAddress: "123 Sukhumvit Rd, Khlong Toei, Bangkok 10110"
                  paymentMethod: credit_card
                  status: pending
                  cancellationReason: null
                  totalPrice: "289.49"
                  totalQuantity: 2
                  orderDate: "2026-09-19T00:00:00.000Z"
                  items:
                    - productId: 1
                      name: Wireless Noise-Cancelling Headphones
                      quantity: 1
                      unitPrice: "199.99"
                      subtotal: "199.99"
                    - productId: 2
                      name: Mechanical Gaming Keyboard
                      quantity: 1
                      unitPrice: "89.50"
                      subtotal: "89.50"
        "400":
          $ref: "#/components/responses/InvalidOrderId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /orders/{id}/cancel:
    patch:
      summary: Cancel an order
      description: Request order cancellation. Allowed only when order status is pending and accessible by the order owner (User).
      security:
        - bearerAuth: []
      tags:
        - Orders
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderInput"
      responses:
        "200":
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelOrderResponse"
              example:
                success: true
                message: Order cancelled successfully
                data:
                  id: 1
                  status: cancelled
                  cancellationReason: Ordered by mistake
        "400":
          description: Validation failed or Order status is not pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidOrderId:
                  summary: Invalid order ID
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: params
                        field: id
                        message: Invalid order ID
                notPending:
                  summary: Order is not pending
                  value:
                    success: false
                    message: Only pending orders can be cancelled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /admin/orders:
    get:
      summary: Get all orders (Admin)
      description: Retrieve all orders across all users in the system. Accessible only by Admin.
      security:
        - bearerAuth: []
      tags:
        - Admin Orders
      responses:
        "200":
          description: Orders fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersResponse"
              example:
                success: true
                message: Orders fetched successfully
                data:
                  - id: 1
                    userId: 2
                    shippingAddress: "123 Sukhumvit Rd, Khlong Toei, Bangkok 10110"
                    paymentMethod: credit_card
                    status: pending
                    cancellationReason: null
                    totalPrice: "289.49"
                    totalQuantity: 2
                    orderDate: "2026-09-19T00:00:00.000Z"
                    items:
                      - productId: 1
                        name: Wireless Noise-Cancelling Headphones
                        quantity: 1
                        unitPrice: "199.99"
                        subtotal: "199.99"
                      - productId: 2
                        name: Mechanical Gaming Keyboard
                        quantity: 1
                        unitPrice: "89.50"
                        subtotal: "89.50"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /admin/orders/{orderId}/status:
    patch:
      summary: Update order status (Admin)
      description: Update the processing status of an order. Accessible only by Admin.
      security:
        - bearerAuth: []
      tags:
        - Admin Orders
      parameters:
        - $ref: "#/components/parameters/OrderIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusInput"
      responses:
        "200":
          description: Order status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateOrderStatusResponse"
              example:
                success: true
                message: Order status updated successfully
                data:
                  id: 1
                  status: cancelled
                  cancellationReason: Ordered by mistake
        "400":
          description: Validation failed or invalid order status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
              examples:
                invalidOrderId:
                  summary: Invalid order ID
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: params
                        field: orderId
                        message: Order ID must be a positive integer
                invalidStatus:
                  summary: Invalid order status
                  value:
                    success: false
                    message: Validation failed
                    errors:
                      - location: body
                        field: status
                        message: "Invalid status. Allowed values: pending, paid, shipped, cancelled"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1

    OrderIdParam:
      name: orderId
      in: path
      required: true
      description: ID of the order to update
      schema:
        type: integer
        minimum: 1
      example: 1

    UserIdParam:
      name: userId
      in: path
      required: true
      description: ID of the user whose role is being updated
      schema:
        type: integer
        minimum: 1
      example: 1

  schemas:
    RegisterInput:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: P@ssw0rd123
        phone:
          type: string
          example: "0812345678"

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: P@ssw0rd123

    UpdateUserInput:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: user@example.com
        phone:
          type: string
          example: "0812345678"

    UpdateUserRoleInput:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - user
            - admin
          description: Target role for the user
          example: admin

    CategoryInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Electronics

    ProductInput:
      type: object
      required:
        - name
        - price
        - stock
      properties:
        name:
          type: string
          example: Product 1
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 100
        stock:
          type: integer
          minimum: 0
          example: 10
        description:
          type: string
          nullable: true
          example: Description 1
        categoryId:
          type: integer
          minimum: 1
          nullable: true
          example: 1

    AddToCartInput:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: integer
          minimum: 1
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2

    UpdateCartItemInput:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 3

    CheckoutInput:
      type: object
      required:
        - shippingAddress
        - paymentMethod
      properties:
        shippingAddress:
          type: string
          example: "123 Sukhumvit Rd, Khlong Toei, Bangkok 10110"
        paymentMethod:
          type: string
          enum:
            - credit_card
            - paypal
            - bank_transfer
          example: credit_card

    CancelOrderInput:
      type: object
      properties:
        reason:
          type: string
          description: Reason for cancelling the order
          example: Ordered by mistake

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: user@example.com
        phone:
          type: string
          nullable: true
          example: "0812345678"
        role:
          type: string
          enum:
            - user
            - admin
          example: user

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Electronics

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Product 1
        price:
          type: string
          example: "100.00"
        stock:
          type: integer
          example: 10
        description:
          type: string
          nullable: true
          example: Description 1
        categoryId:
          type: integer
          nullable: true
          example: 1

    CartItem:
      type: object
      properties:
        productId:
          type: integer
          example: 1
        name:
          type: string
          example: Product 1
        price:
          type: string
          example: "100.00"
        quantity:
          type: integer
          minimum: 1
          example: 2
        subtotal:
          type: string
          example: "200.00"

    Cart:
      type: object
      properties:
        id:
          type: integer
          nullable: true
          example: 1
        userId:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        totalQuantity:
          type: integer
          example: 2
        totalPrice:
          type: string
          example: "200.00"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Error message

    ValidationErrorItem:
      type: object
      properties:
        location:
          type: string
          example: body
        field:
          type: string
          example: email
        message:
          type: string
          example: Invalid email address

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorItem"

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User logged in successfully
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful
        data:
          $ref: "#/components/schemas/User"

    UsersResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Users fetched successfully
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"

    UpdateUserRoleResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User role updated successfully
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            role:
              type: string
              example: admin

    CategoryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Category created successfully
        data:
          $ref: "#/components/schemas/Category"

    CategoriesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Categories fetched successfully
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    ProductResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful
        data:
          $ref: "#/components/schemas/Product"

    ProductsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Products fetched successfully
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    CartResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Product added to cart successfully
        data:
          $ref: "#/components/schemas/Cart"

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful

    OrderItem:
      type: object
      properties:
        productId:
          type: integer
          example: 1
        name:
          type: string
          example: Wireless Noise-Cancelling Headphones
        quantity:
          type: integer
          minimum: 1
          example: 1
        unitPrice:
          type: string
          example: "199.99"
        subtotal:
          type: string
          example: "199.99"

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 2
        shippingAddress:
          type: string
          example: "123 Sukhumvit Rd, Khlong Toei, Bangkok 10110"
        paymentMethod:
          type: string
          example: credit_card
        status:
          type: string
          enum:
            - pending
            - paid
            - shipped
            - cancelled
          example: pending
        cancellationReason:
          type: string
          nullable: true
          example: null
        totalPrice:
          type: string
          example: "289.49"
        totalQuantity:
          type: integer
          example: 2
        orderDate:
          type: string
          format: date-time
          example: "2026-09-19T00:00:00.000Z"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"

    OrderResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Order created successfully
        data:
          $ref: "#/components/schemas/Order"

    OrdersResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Orders fetched successfully
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"

    CancelOrderResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Order cancelled successfully
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            status:
              type: string
              example: cancelled
            cancellationReason:
              type: string
              nullable: true
              example: Ordered by mistake

    UpdateOrderStatusInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - paid
            - shipped
            - cancelled
          description: Target order status
          example: shipped
        cancellationReason:
          type: string
          nullable: true
          description: Reason for cancellation (used when status is cancelled)
          example: Customer requested cancellation

    UpdateOrderStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Order status updated successfully
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            status:
              type: string
              example: cancelled
            cancellationReason:
              type: string
              nullable: true
              example: Ordered by mistake

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Unauthorized

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Forbidden

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Not found

    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Resource already exists

    InvalidUserId:
      description: Invalid user ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            success: false
            message: Validation failed
            errors:
              - location: params
                field: id
                message: Invalid user ID

    InvalidProductId:
      description: Invalid product ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            success: false
            message: Validation failed
            errors:
              - location: params
                field: id
                message: Invalid product ID

    InvalidCartId:
      description: Invalid cart ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            success: false
            message: Validation failed
            errors:
              - location: params
                field: id
                message: Invalid cart ID

    InvalidOrderId:
      description: Invalid order ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            success: false
            message: Validation failed
            errors:
              - location: params
                field: id
                message: Invalid order ID

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            message: Internal server error
